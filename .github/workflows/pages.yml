name: Deploy web app to GitHub Pages

# The Aegis Vault web app is a dependency-free static site living in ./web.
# There is no build step, so this workflow just publishes that folder.
#
# Pages must be set to "GitHub Actions" as the source in the repo settings once;
# after that every push to a branch listed below republishes automatically.

on:
  push:
    branches:
      - app-demo
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Give the service worker a unique cache key per deploy. Without this an
      # already-installed client keeps serving the old shell and never sees the
      # update, because the cache name never changes.
      - name: Stamp the service worker
        run: node tools/stamp-sw.mjs "${{ github.run_id }}-${{ github.run_number }}"
        working-directory: ./web

      - name: Upload web/ as the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The app uses only relative URLs, so it works from the project
          # subpath (https://<user>.github.io/<repo>/) without a rewrite.
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
